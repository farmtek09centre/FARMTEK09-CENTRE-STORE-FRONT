<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FARMTEK09 CENTRE — Track Order</title><link rel="stylesheet" href="styles.css"></head>
<body class="track-page"><header class="topbar"><div class="topbar-inner"><a class="brand" href="index.html">FARMTEK09 CENTRE</a><a class="topbar-whatsapp" id="trackWhatsapp" href="#" target="_blank" rel="noopener">WhatsApp</a></div></header><main class="track-main"><div class="track-card"><p class="eyebrow">Order tracking</p><h1>Check your FARMTEK09 CENTRE order</h1><form id="trackForm" class="checkout-form"><div class="form-grid"><label>Order number<input id="trackId" required placeholder="FT09-YYYYMMDD-XXXXXX"></label><label>Tracking token<input id="trackToken" required placeholder="Provided after checkout"></label></div><button class="btn btn-primary" type="submit">Track order</button><p id="trackStatus" class="checkout-status" role="status"></p></form><div id="trackResult" class="order-result" hidden></div></div></main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const money=n=>Number(n||0).toLocaleString("en-KE");const params=new URLSearchParams(location.search);if(params.get("id"))$("trackId").value=params.get("id");if(params.get("token"))$("trackToken").value=params.get("token");
function wa(phone,text){return `https://wa.me/${String(phone).replace(/\D/g,"")}?text=${encodeURIComponent(text)}`}
async function track(event){event.preventDefault();const id=$("trackId").value.trim(),token=$("trackToken").value.trim();$("trackStatus").textContent="Loading order…";try{const r=await fetch(`/api/orders/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`),o=await r.json();if(!r.ok)throw new Error(o.message||"Order not found.");$("trackStatus").textContent="";$("trackResult").hidden=false;$("trackResult").innerHTML=`<div class="order-success"><p class="eyebrow">${esc(o.status.replace(/_/g," "))}</p><h2>${esc(o.id)}</h2><p><strong>${esc(o.customerName)}</strong> · ${esc(o.paymentStatus)}</p><div class="cart-summary"><div><span>Items</span><strong>${o.items.reduce((s,i)=>s+Number(i.quantity),0)}</strong></div><div><span>Total</span><strong>KES ${money(o.total)}</strong></div></div><h3>Items</h3><ul>${o.items.map(i=>`<li>${esc(i.name)} × ${i.quantity} — KES ${money(i.lineTotal)}</li>`).join("")}</ul><p><strong>Fulfilment:</strong> ${o.deliveryMethod==='delivery'?`${esc(o.deliveryZone)} · ${esc(o.address)}`:'Collection from FARMTEK09 CENTRE nursery'}</p>${o.mpesaReceipt?`<p><strong>M-PESA receipt:</strong> ${esc(o.mpesaReceipt)}</p>`:""}<div class="order-result-actions"><a class="btn btn-whatsapp" href="${wa(o.phone,`Hi FARMTEK09 CENTRE! I’m following up on order ${o.id}. Current status: ${o.status.replace(/_/g," ")}.`)}" target="_blank" rel="noopener">Message on WhatsApp</a><a class="btn btn-secondary" href="index.html">Back to store</a></div></div>`;}catch(error){$("trackResult").hidden=true;$("trackStatus").textContent=error.message}}
$("trackForm").addEventListener("submit",track);$("trackWhatsapp").href="https://wa.me/254725528888?text="+encodeURIComponent("Hi FARMTEK09 CENTRE! I need help tracking my order.");
if(params.get("id")&&params.get("token"))setTimeout(()=>$("trackForm").requestSubmit(),50);
</script></body></html>
