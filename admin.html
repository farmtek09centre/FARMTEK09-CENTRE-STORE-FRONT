<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FARMTEK09 Centre — Admin</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f0;color:#172016}.wrap{max-width:1100px;margin:auto;padding:24px}.panel{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin:16px 0}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;margin:5px 0 12px}button{padding:10px 14px;border:0;border-radius:9px;cursor:pointer;background:#183d22;color:#fff}.danger{background:#a52a2a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#666}.hidden{display:none}.product{border:1px solid #ddd;border-radius:12px;padding:12px}.product img{width:80px;height:80px;object-fit:cover;border-radius:10px;float:right}.status{min-height:24px}.stock{font-weight:700}</style></head><body><main class="wrap"><h1>FARMTEK09 Centre Admin</h1><p class="muted">Manage prices, stock, photos and products. Changes are saved to the catalogue API.</p><section id="login" class="panel"><h2>Admin sign in</h2><input id="password" type="password" placeholder="Admin password"><button id="loginBtn">Sign in</button><p id="loginStatus" class="status"></p></section><section id="dashboard" class="hidden"><div class="panel"><h2 id="formTitle">Add product</h2><input id="pid" type="hidden"><label>Name</label><input id="name"><div class="row"><div><label>Category</label><input id="category"></div><div><label>Price (KES)</label><input id="price" type="number" min="0"></div><div><label>Stock quantity</label><input id="stock" type="number" min="0" placeholder="Leave blank = enquire"></div></div><label>Image URL</label><input id="image"><label>Short description</label><textarea id="blurb" rows="3"></textarea><div class="row"><button id="saveBtn">Save product</button><button id="cancelBtn" type="button">Clear</button></div><p id="formStatus" class="status"></p></div><div class="panel"><div class="row"><input id="filter" placeholder="Search products"><button id="refreshBtn">Refresh</button></div><div id="products" class="grid"></div></div></section></main><script src="admin.js"></script></body></html>
